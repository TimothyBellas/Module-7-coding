name: compose-demo

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-llama3.2:1b}
      CHROMA_PATH: /app/chroma_data
      DOCS_PATH: /app/docs
      TOP_K: "3"
      DISTANCE_THRESHOLD: "1.0"
      OLLAMA_TIMEOUT: "180"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert data['status'] == 'healthy'"
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
